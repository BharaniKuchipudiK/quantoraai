name: One-shot attachment hook patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'study/attachment-5mib-ingestion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Apply exact pending-upload preservation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hooks/useChatStream.js')
          source = path.read_text()

          old_clear = """    updateActiveMessages(prev => [...prev, userMsg]);
              if (!textToSend) setInputText('');
              setAttachments([]);
          """.replace('              ', '')
          new_clear = """    updateActiveMessages(prev => [...prev, userMsg]);
              if (!textToSend) setInputText('');
              const privateUploadCandidates = attachments.filter((attachment) => (
                attachment?.type === 'document'
                && Number.parseFloat(String(attachment?.size || '0')) > 3 * 1024
              ));
              setAttachments(privateUploadCandidates);
          """.replace('              ', '')

          old_partition = """    const attachedDocuments = carryDocuments(carriedDocumentsRef, owningSessionId, partitioned.documents);

              if (!text.trim() && !attachedImages.length && !attachedDocuments.length) {
          """.replace('              ', '')
          new_partition = """    const attachedDocuments = carryDocuments(carriedDocumentsRef, owningSessionId, partitioned.documents);
              if (privateUploadCandidates.length) {
                const pendingUploadNames = new Set(
                  excluded.filter((entry) => entry.reason === 'uploading').map((entry) => entry.name),
                );
                setAttachments(privateUploadCandidates.filter((attachment) => pendingUploadNames.has(attachment?.name)));
              }

              if (!text.trim() && !attachedImages.length && !attachedDocuments.length) {
          """.replace('              ', '')

          if source.count(old_clear) != 1:
              raise SystemExit(f'expected one exact early-clear block, found {source.count(old_clear)}')
          if source.count(old_partition) != 1:
              raise SystemExit(f'expected one exact partition block, found {source.count(old_partition)}')

          source = source.replace(old_clear, new_clear, 1).replace(old_partition, new_partition, 1)
          path.write_text(source)
          PY

          git diff --check
          git diff -- src/hooks/useChatStream.js

      - name: Push exact hook patch
        shell: bash
        run: |
          git config user.name "quantora-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/hooks/useChatStream.js
          git commit -m "Study: preserve pending large attachment"
          git push origin HEAD:${{ github.head_ref }}
