# Each evaluation case spends real provider credit. The daily schedule was
# removed at the owner's request; each manual run now needs spending consent.
name: Desk Eval

on:
  workflow_dispatch:
    inputs:
      confirm_live_model_spend:
        description: 'I authorize this one evaluation run to spend provider credit for the selected tier.'
        required: true
        default: false
        type: boolean
      tier:
        description: 'smoke (4 turns) | standard (8) | full (18) | adversarial (7)'
        required: true
        default: smoke
        type: choice
        options: [smoke, standard, full, adversarial]
      target:
        description: 'Deployment URL to drive. Blank = production.'
        required: false
        type: string
      floor:
        description: 'Correctness floor (0 records findings without failing the run).'
        required: false
        default: '0'
        type: string

concurrency:
  group: desk-eval
  cancel-in-progress: false

jobs:
  eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_model_spend == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser binary
        run: npx playwright install chromium
      - name: Resolve the target deployment
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          PRODUCTION_URL: ${{ secrets.QUANTORA_PRODUCTION_URL }}
        run: |
          url="${INPUT_TARGET:-$PRODUCTION_URL}"
          if [ -z "$url" ]; then
            echo "No target: pass one to the dispatch, or set the QUANTORA_PRODUCTION_URL secret." >&2
            exit 1
          fi
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - name: Run the desk eval
        env:
          QUANTORA_E2E_BASE_URL: ${{ steps.target.outputs.url }}
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EVAL_TIER: ${{ inputs.tier || 'smoke' }}
          EVAL_FLOOR: ${{ inputs.floor || '0' }}
        run: node scripts/desk-eval.mjs --tier "$EVAL_TIER" --floor "$EVAL_FLOOR"
      - name: Upload the report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-eval-${{ inputs.tier || 'smoke' }}
          path: artifacts/desk-eval
          if-no-files-found: ignore
          retention-days: 30
      - name: Put the report in the job summary
        if: always()
        run: cat artifacts/desk-eval/report.md >> "$GITHUB_STEP_SUMMARY" || true
