name: Apply Premium Feedback Polish

on:
  push:
    branches:
      - feat/premium-feedback-admin

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[premium-feedback-polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-feedback-admin
      - name: Patch admin access and feedback drawer behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          panel = Path('src/components/AdminFeedbackPanel.jsx')
          text = panel.read_text()
          old = "const updated = { ...selected, ...(data.item || {}), status };"
          new = "const updated = { ...selected, ...(data.item || {}), user: selected.user, status };"
          if old not in text:
              raise SystemExit('Feedback status merge anchor not found')
          text = text.replace(old, new, 1)

          effect_anchor = """  useEffect(() => {\n    load();\n  }, []);\n\n  const filtered = useMemo(() => {"""
          effect_replacement = """  useEffect(() => {\n    load();\n  }, []);\n\n  useEffect(() => {\n    if (!selected) return undefined;\n    const onKeyDown = (event) => {\n      if (event.key === 'Escape') setSelected(null);\n    };\n    window.addEventListener('keydown', onKeyDown);\n    return () => window.removeEventListener('keydown', onKeyDown);\n  }, [selected]);\n\n  const filtered = useMemo(() => {"""
          if effect_anchor not in text:
              raise SystemExit('Feedback drawer escape anchor not found')
          text = text.replace(effect_anchor, effect_replacement, 1)
          panel.write_text(text)

          header = Path('src/components/Header.jsx')
          text = header.read_text()
          old_condition = "user?.email === 'bharanik.h@gmail.com'"
          if old_condition not in text:
              raise SystemExit('Legacy admin email condition not found')
          text = text.replace(old_condition, 'user?.isAdmin', 1)
          text = text.replace('<span>Admin Analytics Dashboard</span>', '<span>Admin Dashboard</span>', 1)
          header.write_text(text)
          PY
          git add src/components/AdminFeedbackPanel.jsx src/components/Header.jsx
          git config user.name "Quantora Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Polish feedback workflow and align admin access [premium-feedback-polish-applied]"
          git push origin feat/premium-feedback-admin
