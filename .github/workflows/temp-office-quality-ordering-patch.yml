name: Temporary Office Quality Ordering Patch

on:
  push:
    branches:
      - test/office-synthetic-release-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[office-quality-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/office-synthetic-release-gate
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply asserted patch
        run: node scripts/apply-office-quality-ordering-patch.mjs
      - name: Commit patched production source
        run: |
          if git diff --quiet -- api/generate-office.ts; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "quantora-ci"
          git config user.email "actions@users.noreply.github.com"
          git add api/generate-office.ts
          git commit -m "Move presentation quality gate into repair loop [office-quality-patched]"
          git push origin HEAD:test/office-synthetic-release-gate
