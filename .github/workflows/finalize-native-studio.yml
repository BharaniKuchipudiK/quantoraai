name: Finalize Native Studio

on:
  push:
    branches:
      - dev/travel-stability-hotfix
    paths:
      - scripts/finalize-studio-native.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dev/travel-stability-hotfix
          fetch-depth: 0

      - name: Apply deterministic native cleanup
        run: node scripts/finalize-studio-native.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit native Studio finalization
        run: |
          if git diff --quiet; then
            echo "No finalization diff to commit."
            exit 0
          fi
          git config user.name "quantora-quality-bot"
          git config user.email "quality@quantoraai.app"
          git add src/components/AiStudio.jsx src/components/Header.jsx src/components/LivePreviewCanvas.jsx src/styles/studio-toolbar-cleanup.css scripts/media-profile-browser-gate.mjs scripts/study-media-browser-gate.mjs scripts/travel-browser-release-gate.mjs scripts/studio-regression-browser-gate.mjs
          git commit -m "refactor(studio): retire DOM recovery in favor of native React"
          git push origin HEAD:dev/travel-stability-hotfix
