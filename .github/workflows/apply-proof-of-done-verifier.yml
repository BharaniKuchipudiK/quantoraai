name: Apply Proof of Done Verifier Patch

on:
  push:
    branches:
      - feat/outcome-contract-proof-of-done

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[proof-of-done-verifier-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/outcome-contract-proof-of-done
      - name: Patch conversation verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/_lib/conversation-engine.ts')
          text = path.read_text()

          import_anchor = 'import { formatPclNavigatorDirective, publicPclNavigatorMetadata } from "./pcl-navigator-adapter.js";'
          import_line = import_anchor + '\nimport { evaluateProofOfDone } from "./outcome-contract.js";'
          if import_anchor not in text:
              raise SystemExit('conversation verifier import anchor not found')
          if 'import { evaluateProofOfDone } from "./outcome-contract.js";' not in text:
              text = text.replace(import_anchor, import_line, 1)

          anchor = '''  const claimsExternalCompletion = /\\b(?:i(?:'ve| have)?|we(?:'ve| have)?)\\s+(?:published|deployed|emailed|sent|booked|purchased|paid|deleted|submitted)\\b/i.test(response);\n  if (claimsExternalCompletion && evidence.length === 0) {\n    issue(issues, "external_action_without_evidence", "failure");\n  }\n'''
          replacement = anchor + '''\n  const claimsOutcomeDone = /(?:\\b(?:i(?:'ve| have)|we(?:'ve| have))\\s+(?:completed|finished)\\b|\\b(?:it|this|the (?:work|task|project|artifact|document|presentation|deck|site|website|app)|your (?:request|document|presentation|deck|site|website|app))\\s+(?:is|has been)\\s+(?:done|complete|completed|finished|ready)\\b)/i.test(response);\n  if (claimsOutcomeDone) {\n    const proof = evaluateProofOfDone(input.snapshot);\n    if (proof.status !== "verified") {\n      issue(issues, "outcome_done_without_proof", "failure");\n    }\n  }\n'''
          if anchor not in text:
              raise SystemExit('external completion verifier anchor not found')
          if 'outcome_done_without_proof' not in text:
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
          git add api/_lib/conversation-engine.ts
          git config user.name "Quantora Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Enforce Proof of Done in response verification [proof-of-done-verifier-applied]"
          git push origin feat/outcome-contract-proof-of-done
