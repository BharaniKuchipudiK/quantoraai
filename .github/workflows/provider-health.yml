name: Provider health

# The provider watch. On 2026-09-06 Gemini's project spend cap was hit in
# the night and production answered "no healthy AI route" until a screenshot
# arrived in the morning: self-healing triggers on an error inside a turn,
# and nothing watched the providers between turns. Every half hour this reads
# the production deployment's own probes — readiness, a live Gemini turn, the
# free OpenRouter credential check — and FAILS when a provider is missing,
# refused, capped, exhausted or unreachable. A failed scheduled run is what
# GitHub emails the owner about; a green one is silent. The verdict is the
# last line of the log.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  # Temporary one-shot branch hook. The patch job below restores this workflow
  # byte-for-byte from origin/main before it commits, so it cannot remain in the PR.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: provider-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reliability-patch:
    name: One-shot execution-spine patch
    if: github.event_name == 'pull_request' && github.head_ref == 'reliability/execution-spine-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact guarded patch
        run: python3 scripts/reliability-execution-spine-surgical.py

      - name: Prove durable terminal traces
        run: npx tsx --test api/_lib/transaction-trace.test.ts

      - name: Prove recovery policy and caller wiring
        run: node --test src/lib/turn-recovery.test.js src/lib/coding-desk-artifact-repair-cap.test.js src/lib/execution-spine-recovery-wiring.test.js

      - name: Lint production changes
        run: npm run lint

      - name: Restore temporary machinery and commit only verified reliability changes
        run: |
          git show origin/main:.github/workflows/provider-health.yml > .github/workflows/provider-health.yml
          rm scripts/reliability-execution-spine-surgical.py
          git config user.name quantora-reliability-bot
          git config user.email actions@users.noreply.github.com
          git add api/_lib/chat-handler.ts api/_lib/transaction-trace.test.ts src/hooks/useChatStream.js src/lib/execution-spine-recovery-wiring.test.js .github/workflows/provider-health.yml scripts/reliability-execution-spine-surgical.py
          git commit -m "Harden terminal traces and recovery state wiring"
          git push origin HEAD:${{ github.head_ref }}

  probe:
    name: Provider health probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependency install: the probe is Node and fetch, so the only thing
      # that can fail here is the deployment it watches.
      - name: Read the production providers
        id: provider_health
        env:
          QUANTORA_E2E_BASE_URL: https://quantoraai.app
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/provider-health-probe.mjs

      - name: Keep the probe's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-${{ github.run_id }}
          path: artifacts/provider-health
          if-no-files-found: ignore
          retention-days: 14

      - name: The verdict, last
        if: always()
        run: |
          if [ -f artifacts/provider-health/verdict.txt ]; then
            cat artifacts/provider-health/verdict.txt
          fi
