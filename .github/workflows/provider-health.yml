name: Provider health

# Scheduled checks must not consume Gemini tokens. Readiness is configuration
# and function availability, NOT proof that a model can generate. A paid live
# probe remains available only with confirmation on a manual run.
on:
  workflow_dispatch:
    inputs:
      confirm_live_model_spend:
        description: 'I authorize this one live provider probe to spend provider credit.'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: provider-health
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_model_spend == true && 'Provider health live probe' || 'Provider readiness (generation NOT TESTED)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read production readiness without model generation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_live_model_spend != true }}
        env:
          QUANTORA_E2E_BASE_URL: https://quantoraai.app
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider-health
          echo "Live inference NOT TESTED: automatic model spending is paused." > artifacts/provider-health/verdict.txt
          node scripts/deployed-readiness-gate.mjs 2>&1 | tee artifacts/provider-health/readiness.txt
          echo "Readiness passed. Live inference NOT TESTED: no generation probe was run." > artifacts/provider-health/verdict.txt

      - name: Read the production providers
        id: provider_health
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_model_spend == true }}
        env:
          QUANTORA_E2E_BASE_URL: https://quantoraai.app
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/provider-health-probe.mjs

      - name: Keep the probe's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-${{ github.run_id }}
          path: artifacts/provider-health
          if-no-files-found: ignore
          retention-days: 14
      - name: The verdict, last
        if: always()
        run: |
          if [ -f artifacts/provider-health/verdict.txt ]; then
            cat artifacts/provider-health/verdict.txt
            cat artifacts/provider-health/verdict.txt >> "$GITHUB_STEP_SUMMARY"
          fi
