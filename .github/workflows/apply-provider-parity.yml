name: Apply provider parity patch

on:
  push:
    branches:
      - feat/qir-provider-tool-parity
    paths:
      - scripts/apply-openrouter-tool-parity.mjs
      - .github/workflows/apply-provider-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/qir-provider-tool-parity
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-openrouter-tool-parity.mjs
      - name: Commit patched handler
        run: |
          if git diff --quiet -- api/_lib/chat-handler.ts; then
            echo "No handler changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_lib/chat-handler.ts
          git commit -m "agent: route OpenRouter through universal tool fabric"
          git push origin HEAD:feat/qir-provider-tool-parity
