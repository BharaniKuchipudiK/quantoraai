name: Temporary Office Engine Label Patch

on:
  push:
    branches:
      - fix/office-preview-workspace-ux

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[office-engine-label-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/office-preview-workspace-ux
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply asserted patch
        run: node scripts/apply-office-engine-label-patch.mjs
      - name: Commit patched UI source
        run: |
          if git diff --quiet -- src/components/AiStudio.jsx; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "quantora-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AiStudio.jsx
          git commit -m "Show exact Office generation engine [office-engine-label-patched]"
          git push origin HEAD:fix/office-preview-workspace-ux
