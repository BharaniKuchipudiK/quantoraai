name: Temporary Office Integration Merge

on:
  push:
    branches:
      - integration/office-quality-workspace

permissions:
  contents: write

jobs:
  merge:
    if: ${{ !contains(github.event.head_commit.message, '[office-integration-merged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/office-quality-workspace
          fetch-depth: 0
      - name: Merge tested Office workspace branch
        run: |
          git config user.name "quantora-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin fix/office-preview-workspace-ux
          git merge --no-ff --no-edit origin/fix/office-preview-workspace-ux
          git commit --amend -m "Integrate Office quality and workspace UX [office-integration-merged]"
          git push origin HEAD:integration/office-quality-workspace
