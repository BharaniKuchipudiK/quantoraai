name: Apply Studio P0 recovery patch

on:
  push:
    branches:
      - fix/studio-p0-preview-navigation
    paths:
      - .github/workflows/patch-studio-p0.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-p0-preview-navigation
          fetch-depth: 0

      - name: Apply Studio shell and preview runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Remove duplicate Studio-sidebar Canvas/Profile. The global header is
          # the single owner of top-level navigation and account/profile controls.
          ai = Path('src/components/AiStudio.jsx')
          text = ai.read_text()
          start_marker = "        {/* Native Studio navigation controls. These replace the former DOM-injected Canvas/Profile rows. */}"
          end_marker = "        {/* Product feedback — explicit signed-in Studio entry point. */}"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate duplicate Canvas/Profile sidebar block')
          text = text[:start] + text[end:]
          ai.write_text(text)

          # 2) Route standalone generated React/JSX through Sandpack's real Vite
          # runtime instead of stripping imports and hoping Babel globals exist.
          live = Path('src/components/LivePreviewCanvas.jsx')
          text = live.read_text()
          text = text.replace(
              "import React, { useState, useRef, useEffect, useCallback } from 'react';",
              "import React, { useState, useRef, useEffect, useCallback, useMemo } from 'react';",
              1,
          )
          text = text.replace(
              "import { isProjectRuntimeVfs } from '../lib/project-runtime-preview.js';",
              "import { createInlineReactRuntimeVfs, isProjectRuntimeVfs } from '../lib/project-runtime-preview.js';",
              1,
          )
          old = """  const projectRuntimeActive = isProjectRuntimeVfs(vfs);\n  const previewFrame = projectRuntimeActive ? (\n    <ProjectRuntimePreview vfs={vfs} />\n  ) : ((currentCode && embedSrc) || wcUrl ? ("""
          new = """  const projectRuntimeVfs = useMemo(\n    () => (isProjectRuntimeVfs(vfs) ? vfs : createInlineReactRuntimeVfs(currentCode, vfs)),\n    [currentCode, vfs],\n  );\n  const projectRuntimeActive = Boolean(projectRuntimeVfs);\n  const previewFrame = projectRuntimeActive ? (\n    <ProjectRuntimePreview vfs={projectRuntimeVfs} />\n  ) : ((currentCode && embedSrc) || wcUrl ? ("""
          if old not in text:
              raise SystemExit('Could not locate LivePreview project runtime switch')
          text = text.replace(old, new, 1)
          live.write_text(text)

          # 3) Extend the project-runtime adapter so a single generated React
          # component becomes a real Vite project, preserving package imports.
          runtime = Path('src/lib/project-runtime-preview.js')
          runtime.write_text(r'''function fileContent(value) {
            if (typeof value === 'string') return value;
            if (value && typeof value.content === 'string') return value.content;
            if (value && typeof value.code === 'string') return value.code;
            return '';
          }

          const RUNTIME_DEPENDENCY_VERSIONS = Object.freeze({
            react: '^19.0.1',
            'react-dom': '^19.0.1',
            'lucide-react': '^0.546.0',
            'framer-motion': '^12.23.12',
            recharts: '^3.1.2',
          });

          function barePackageName(specifier = '') {
            const source = String(specifier || '').trim();
            if (!source || source.startsWith('.') || source.startsWith('/') || source.startsWith('@/') || source.startsWith('~')) return null;
            if (source.startsWith('@')) {
              const [scope, name] = source.split('/');
              return scope && name ? `${scope}/${name}` : null;
            }
            return source.split('/')[0] || null;
          }

          export function extractRuntimeDependencies(code = '') {
            const dependencies = { react: RUNTIME_DEPENDENCY_VERSIONS.react, 'react-dom': RUNTIME_DEPENDENCY_VERSIONS['react-dom'] };
            const source = String(code || '');
            const pattern = /(?:import\s+(?:[^'\"]+?\s+from\s+)?|import\s*)['\"]([^'\"]+)['\"]/g;
            for (const match of source.matchAll(pattern)) {
              const pkg = barePackageName(match[1]);
              if (!pkg || pkg === 'react' || pkg === 'react-dom') continue;
              dependencies[pkg] = RUNTIME_DEPENDENCY_VERSIONS[pkg] || 'latest';
            }
            return dependencies;
          }

          export function isInlineReactRuntimeCode(code = '') {
            const source = String(code || '');
            if (!source.trim()) return false;
            return /(?:from\s+['\"]react['\"]|import\s+React\b|useState\s*\(|useEffect\s*\(|export\s+default\s+(?:function|class)|ReactDOM\.createRoot\s*\(|createRoot\s*\(|<[A-Z][A-Za-z0-9_.:-]*(?:\s|\/?>))/m.test(source);
          }

          function ensureDefaultExport(code) {
            const source = String(code || '').trim();
            if (/export\s+default\b/.test(source)) return source;
            const functionMatch = source.match(/function\s+([A-Z][A-Za-z0-9_]*)\s*\(/);
            const constMatch = source.match(/(?:const|let|var)\s+([A-Z][A-Za-z0-9_]*)\s*=\s*(?:\([^)]*\)|[A-Za-z0-9_]+)\s*=>/);
            const component = functionMatch?.[1] || constMatch?.[1];
            return component ? `${source}\n\nexport default ${component};\n` : source;
          }

          export function createInlineReactRuntimeVfs(code = '', existingVfs = {}) {
            if (!isInlineReactRuntimeCode(code)) return null;
            if (isProjectRuntimeVfs(existingVfs)) return existingVfs;

            const source = String(code || '').trim();
            const dependencies = extractRuntimeDependencies(source);
            const hasOwnMount = /(?:ReactDOM\.)?createRoot\s*\(|ReactDOM\.render\s*\(/.test(source);
            const files = {
              'package.json': {
                content: JSON.stringify({
                  name: 'quantora-generated-preview',
                  private: true,
                  version: '1.0.0',
                  type: 'module',
                  dependencies,
                }, null, 2),
                language: 'json',
              },
              'index.html': {
                content: '<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>',
                language: 'html',
              },
            };

            if (hasOwnMount) {
              files['src/main.jsx'] = { content: source, language: 'jsx' };
            } else {
              files['src/App.jsx'] = { content: ensureDefaultExport(source), language: 'jsx' };
              files['src/main.jsx'] = {
                content: "import React from 'react';\nimport { createRoot } from 'react-dom/client';\nimport App from './App.jsx';\nimport './index.css';\n\ncreateRoot(document.getElementById('root')).render(\n  <React.StrictMode><App /></React.StrictMode>,\n);\n",
                language: 'jsx',
              };
            }

            const css = [fileContent(existingVfs?.['index.css']), fileContent(existingVfs?.['App.css'])].filter(Boolean).join('\n');
            files['src/index.css'] = {
              content: css || 'html,body,#root{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#0f172a}*{box-sizing:border-box}',
              language: 'css',
            };

            return files;
          }

          export function isProjectRuntimeVfs(vfs = {}) {
            const names = Object.keys(vfs || {});
            if (!names.includes('package.json')) return false;
            return names.some((name) => /(?:^|\/)src\/(?:main|App)\.(?:jsx|tsx|js|ts)$/i.test(name));
          }

          export function projectRuntimeConfig(vfs = {}) {
            if (!isProjectRuntimeVfs(vfs)) return null;

            let pkg = {};
            try {
              pkg = JSON.parse(fileContent(vfs['package.json']) || '{}');
            } catch {
              pkg = {};
            }

            const names = Object.keys(vfs || {});
            const dependencies = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            const usesReact = Boolean(dependencies.react)
              || names.some((name) => /(?:^|\/)src\/(?:main|App)\.(?:jsx|tsx)$/i.test(name));
            const usesTypeScript = names.some((name) => /\.tsx?$/i.test(name));
            const template = usesReact
              ? (usesTypeScript ? 'vite-react-ts' : 'vite-react')
              : (usesTypeScript ? 'vanilla-ts' : 'vanilla');

            const files = {};
            for (const [path, value] of Object.entries(vfs || {})) {
              if (path === 'package.json') continue;
              files[`/${path.replace(/^\/+/, '')}`] = { code: fileContent(value) };
            }

            return { template, files, dependencies, packageJson: pkg };
          }
          '''.replace('\n          ', '\n').lstrip())

          # 4) Add unit coverage for the exact failure class: a simple calculator
          # component importing lucide-react must become an executable project.
          Path('src/lib/project-runtime-preview.test.js').write_text(r'''import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            createInlineReactRuntimeVfs,
            extractRuntimeDependencies,
            isInlineReactRuntimeCode,
            isProjectRuntimeVfs,
            projectRuntimeConfig,
          } from './project-runtime-preview.js';

          const calculator = `
          import React, { useState } from 'react';
          import { Delete, Divide, Minus, Plus, X, Equal } from 'lucide-react';

          export default function Calculator() {
            const [value, setValue] = useState('0');
            return <main><output>{value}</output><button onClick={() => setValue('1')}>1</button><Delete /></main>;
          }
          `;

          test('standalone React calculator is recognized as a real runtime project', () => {
            assert.equal(isInlineReactRuntimeCode(calculator), true);
            const vfs = createInlineReactRuntimeVfs(calculator, {});
            assert.ok(vfs);
            assert.equal(isProjectRuntimeVfs(vfs), true);
            const pkg = JSON.parse(vfs['package.json'].content);
            assert.equal(pkg.dependencies['lucide-react'], '^0.546.0');
            assert.match(vfs['src/App.jsx'].content, /Delete/);
            assert.match(vfs['src/main.jsx'].content, /createRoot/);
          });

          test('bare imports become Sandpack dependencies instead of being stripped', () => {
            const deps = extractRuntimeDependencies(calculator);
            assert.equal(deps.react, '^19.0.1');
            assert.equal(deps['react-dom'], '^19.0.1');
            assert.equal(deps['lucide-react'], '^0.546.0');
          });

          test('plain self-contained HTML stays on the lightweight iframe path', () => {
            assert.equal(isInlineReactRuntimeCode('<!doctype html><html><body>ok</body></html>'), false);
            assert.equal(createInlineReactRuntimeVfs('<!doctype html><html><body>ok</body></html>', {}), null);
          });

          test('generated inline VFS produces a Vite React runtime config', () => {
            const config = projectRuntimeConfig(createInlineReactRuntimeVfs(calculator, {}));
            assert.equal(config.template, 'vite-react');
            assert.ok(config.files['/src/App.jsx']);
            assert.equal(config.dependencies['lucide-react'], '^0.546.0');
          });
          '''.replace('\n          ', '\n').lstrip())

          # 5) Update the Studio browser gate: there must be exactly one account
          # entry point, no sidebar Canvas, and a calculator-style standalone JSX
          # response must enter the real project runtime.
          gate = Path('scripts/studio-regression-browser-gate.mjs')
          g = gate.read_text()
          g = g.replace(
              "const projectReply = [",
              "const calculatorReply = [\n  'Done — here is a working calculator.',\n  '',\n  '```jsx',\n  \"import React, { useState } from 'react';\\nimport { Delete, Divide, Minus, Plus, X, Equal } from 'lucide-react';\\nexport default function Calculator(){ const [value,setValue]=useState('0'); return <main style={{padding:24}}><output data-testid='calculator-display'>{value}</output><button onClick={()=>setValue('1')}>1</button><Delete /></main>}\",\n  '```',\n].join('\\n');\n\nconst projectReply = [",
              1,
          )
          old_chat = """  if (path === '/api/chat') {\n    return route.fulfill({\n      status: 200,\n      headers: { 'content-type': 'text/event-stream; charset=utf-8', 'cache-control': 'no-cache' },\n      body: sseBody(projectReply),\n    });\n  }"""
          new_chat = """  if (path === '/api/chat') {\n    const body = request.postDataJSON?.() || {};\n    const reply = /calculator/i.test(String(body.message || '')) ? calculatorReply : projectReply;\n    return route.fulfill({\n      status: 200,\n      headers: { 'content-type': 'text/event-stream; charset=utf-8', 'cache-control': 'no-cache' },\n      body: sseBody(reply),\n    });\n  }"""
          if old_chat not in g:
              raise SystemExit('Could not locate Studio gate chat mock')
          g = g.replace(old_chat, new_chat, 1)

          old_profile = """  const profile = page.locator('[data-quantora-sidebar-profile]').first();\n  await visible(profile, 'Sidebar Profile entry is missing.');\n  await page.route('https://broken-avatar.quantora.invalid/**', (route) => route.abort());\n  await page.waitForTimeout(250);\n\n  const fallback = profile.locator('[data-quantora-avatar-fallback]').first();\n  await visible(fallback, 'Broken profile image did not fall back to an initial/avatar.');\n\n  await profile.click();\n  const accountMenu = page.locator('#quantora-profile-menu').first();\n  await visible(accountMenu, 'Profile click did not open the real account menu.');"""
          new_profile = """  if (await page.locator('[data-quantora-sidebar-profile]').count()) {\n    throw new Error('Duplicate Profile entry leaked into the Studio sidebar.');\n  }\n  if (await page.locator('[data-quantora-sidebar-canvas]').count()) {\n    throw new Error('Duplicate Canvas entry leaked into the Studio sidebar.');\n  }\n\n  const profile = page.locator('button[aria-controls=\"quantora-profile-menu\"]').first();\n  await visible(profile, 'Header Profile entry is missing.');\n  await profile.click();\n  const accountMenu = page.locator('#quantora-profile-menu').first();\n  await visible(accountMenu, 'Header Profile did not open the real account menu.');"""
          if old_profile not in g:
              raise SystemExit('Could not locate stale sidebar Profile assertions')
          g = g.replace(old_profile, new_profile, 1)

          prompt_marker = """  const prompt = page.locator('.app-shell--studio textarea').first();\n  await visible(prompt, 'Studio prompt input is missing.');\n  await prompt.fill(\"let's build a mission control interface, similar to the expose-style window manager on macOS\");\n  await prompt.press('Enter');"""
          replacement = """  const prompt = page.locator('.app-shell--studio textarea').first();\n  await visible(prompt, 'Studio prompt input is missing.');\n\n  // Exact P0 regression: a simple standalone React calculator with a real package\n  // import must render through the project runtime instead of the old stripped-import iframe.\n  await prompt.fill('Build me a simple calculator');\n  await prompt.press('Enter');\n  const calculatorPreview = page.locator('[data-quantora-real-project-preview=\"true\"]').first();\n  await visible(calculatorPreview, 'Standalone calculator JSX did not enter the real React project preview.', 15_000);\n  await hidden(page.getByText(/Couldn't auto-fix after/i).first(), 'Calculator preview entered the broken auto-repair state.');\n\n  const newChat = page.getByRole('button', { name: /New Chat/i }).first();\n  await visible(newChat, 'New Chat control is missing after calculator preview.');\n  await newChat.click();\n  await visible(prompt, 'Studio prompt disappeared after starting a new chat.');\n  await prompt.fill(\"let's build a mission control interface, similar to the expose-style window manager on macOS\");\n  await prompt.press('Enter');"""
          if prompt_marker not in g:
              raise SystemExit('Could not locate Studio gate prompt sequence')
          g = g.replace(prompt_marker, replacement, 1)
          gate.write_text(g)
          PY

          rm .github/workflows/patch-studio-p0.yml

          git config user.name "quantora-quality-bot"
          git config user.email "quality@quantoraai.app"
          git add -- src/components/AiStudio.jsx src/components/LivePreviewCanvas.jsx src/lib/project-runtime-preview.js src/lib/project-runtime-preview.test.js scripts/studio-regression-browser-gate.mjs .github/workflows/patch-studio-p0.yml
          git commit -m "fix(studio): restore reliable preview and remove duplicate navigation"
          git push origin HEAD:fix/studio-p0-preview-navigation
