name: Finalize Studio Geometry

on:
  push:
    branches:
      - dev/travel-stability-hotfix
    paths:
      - scripts/finalize-studio-geometry.mjs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/travel-stability-hotfix
          fetch-depth: 0
      - run: node scripts/finalize-studio-geometry.mjs
      - run: git diff --check
      - name: Commit geometry fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "quantora-quality-bot"
          git config user.email "quality@quantoraai.app"
          git add src/components/AiStudio.jsx src/components/Header.jsx
          git commit -m "fix(studio): anchor native profile menu to clicked control"
          git push origin HEAD:dev/travel-stability-hotfix
