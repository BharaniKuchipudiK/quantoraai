name: Apply P0 live model route repair

on:
  push:
    branches: [fix/p0-live-model-route]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-live-model-route
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch model routing
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:100]}')
                  text = text.replace(old, new)
              p.write_text(text)

          edit('api/_lib/model-execution-policy.ts', [
            ("const NEMOTRON_SUPER = 'nvidia/nemotron-3-super-120b-a12b:free';\nconst NEMOTRON_ULTRA = 'nvidia/nemotron-3-ultra-550b-a55b:free';",
             "const LAGUNA_S = 'poolside/laguna-s-2.1:free';\nconst NEMOTRON_SUPER_LEGACY = 'nvidia/nemotron-3-super-120b-a12b:free';\nconst NEMOTRON_ULTRA = 'nvidia/nemotron-3-ultra-550b-a55b:free';"),
            ("const QUALIFIED_OPENROUTER_FALLBACKS: Record<string, string> = {\n  [NEMOTRON_SUPER]: NEMOTRON_ULTRA,\n  [NEMOTRON_ULTRA]: NEMOTRON_SUPER,\n};",
             "const QUALIFIED_OPENROUTER_FALLBACKS: Record<string, string> = {\n  [LAGUNA_S]: NEMOTRON_ULTRA,\n  [NEMOTRON_ULTRA]: LAGUNA_S,\n  // Existing browser tabs may still send the retired Super id. Accept it long\n  // enough to fail over cleanly instead of surfacing a dead provider route.\n  [NEMOTRON_SUPER_LEGACY]: LAGUNA_S,\n};"),
            (" * The two live-canary-qualified free Nemotron routes are paired explicitly so\n * a stale/empty registry cannot send a normal Studio turn back to Gemini.",
             " * Quantora pairs two independent free OpenRouter routes (Poolside + NVIDIA)\n * so a single provider/model outage cannot kill a normal Studio turn."),
            ("if ([408, 425, 429, 500, 502, 503, 504].includes(status)) return true;",
             "if ([404, 408, 410, 425, 429, 500, 502, 503, 504].includes(status)) return true;"),
            ("return /timeout|temporar|quota|rate.?limit|high demand|unavailable|network|fetch failed/i.test(message);",
             "return /not found|no endpoints?|timeout|temporar|quota|rate.?limit|high demand|unavailable|network|fetch failed/i.test(message);")
          ])

          edit('api/_lib/model-execution-policy.test.ts', [
            ("fallbackModelIds: ['gemini-flash-latest', 'nvidia/nemotron-3-super-120b-a12b:free'],",
             "fallbackModelIds: ['gemini-flash-latest', 'poolside/laguna-s-2.1:free'],"),
            ("'nvidia/nemotron-3-super-120b-a12b:free',\n  ]);",
             "'poolside/laguna-s-2.1:free',\n  ]);"),
            ("test('live-qualified Nemotron routes fail over to each other before any stale registry candidate', () => {\n  const superAttempts = modelAttemptsForTurn({\n    primaryModelId: 'nvidia/nemotron-3-super-120b-a12b:free',\n    fallbackModelIds: ['gemini-flash-latest', 'openai/gpt-oss-120b:free'],\n  });\n  assert.deepEqual(superAttempts.map((attempt) => attempt.id), [\n    'nvidia/nemotron-3-super-120b-a12b:free',\n    'nvidia/nemotron-3-ultra-550b-a55b:free',\n  ]);\n\n  const ultraAttempts = modelAttemptsForTurn({\n    primaryModelId: 'nvidia/nemotron-3-ultra-550b-a55b:free',\n    fallbackModelIds: ['gemini-flash-latest'],\n  });\n  assert.deepEqual(ultraAttempts.map((attempt) => attempt.id), [\n    'nvidia/nemotron-3-ultra-550b-a55b:free',\n    'nvidia/nemotron-3-super-120b-a12b:free',\n  ]);\n});",
             "test('qualified free routes cross provider boundaries before stale registry candidates', () => {\n  const lagunaAttempts = modelAttemptsForTurn({\n    primaryModelId: 'poolside/laguna-s-2.1:free',\n    fallbackModelIds: ['gemini-flash-latest', 'openai/gpt-oss-120b:free'],\n  });\n  assert.deepEqual(lagunaAttempts.map((attempt) => attempt.id), [\n    'poolside/laguna-s-2.1:free',\n    'nvidia/nemotron-3-ultra-550b-a55b:free',\n  ]);\n\n  const ultraAttempts = modelAttemptsForTurn({\n    primaryModelId: 'nvidia/nemotron-3-ultra-550b-a55b:free',\n    fallbackModelIds: ['gemini-flash-latest'],\n  });\n  assert.deepEqual(ultraAttempts.map((attempt) => attempt.id), [\n    'nvidia/nemotron-3-ultra-550b-a55b:free',\n    'poolside/laguna-s-2.1:free',\n  ]);\n\n  const staleTabAttempts = modelAttemptsForTurn({\n    primaryModelId: 'nvidia/nemotron-3-super-120b-a12b:free',\n    fallbackModelIds: [],\n  });\n  assert.deepEqual(staleTabAttempts.map((attempt) => attempt.id), [\n    'nvidia/nemotron-3-super-120b-a12b:free',\n    'poolside/laguna-s-2.1:free',\n  ]);\n});"),
            ("assert.equal(shouldFallbackBeforeStreaming(Object.assign(new Error('high demand'), { status: 503 })), true);",
             "assert.equal(shouldFallbackBeforeStreaming(Object.assign(new Error('high demand'), { status: 503 })), true);\n  assert.equal(shouldFallbackBeforeStreaming(Object.assign(new Error('provider endpoint not found'), { status: 404 })), true);")
          ])

          edit('api/_lib/model-catalog.js', [
            ("  {\n    id: 'nvidia/nemotron-3-super-120b-a12b:free',\n    name: 'Nemotron 3 Super 120B',\n    provider: 'NVIDIA',\n    description: 'Primary free Quantora route for coding, planning and general reasoning. Live canary qualified.',\n    contextWindow: '262k',\n    available: true,\n    pricingKind: 'free',\n    tag: 'RECOMMENDED',\n    icon: 'cpu',\n  },",
             "  {\n    id: 'poolside/laguna-s-2.1:free',\n    name: 'Laguna S 2.1',\n    provider: 'Poolside',\n    description: 'Primary free Quantora route for software creation, coding and agentic build tasks.',\n    contextWindow: '262k',\n    available: true,\n    pricingKind: 'free',\n    tag: 'RECOMMENDED',\n    icon: 'cpu',\n  },\n  {\n    id: 'nvidia/nemotron-3-ultra-550b-a55b:free',\n    name: 'Nemotron 3 Ultra',\n    provider: 'NVIDIA',\n    description: 'Independent free fallback for deeper reasoning when the primary route is unavailable.',\n    contextWindow: '262k',\n    available: true,\n    pricingKind: 'free',\n    tag: 'FALLBACK',\n    icon: 'brain',\n  },")
          ])

          edit('src/lib/communication/routing/select-models.ts', [
            ("primaryModelId: primary?.id || 'nvidia/nemotron-3-super-120b-a12b:free',",
             "primaryModelId: primary?.id || 'poolside/laguna-s-2.1:free',"),
            ("provider: (primary?.id || 'nvidia/nemotron-3-super-120b-a12b:free').startsWith('gemini') ? 'gemini' : 'openrouter',",
             "provider: (primary?.id || 'poolside/laguna-s-2.1:free').startsWith('gemini') ? 'gemini' : 'openrouter',"),
            ("hasVisionSupport: (primary?.id || 'nvidia/nemotron-3-super-120b-a12b:free').startsWith('gemini'),",
             "hasVisionSupport: (primary?.id || 'poolside/laguna-s-2.1:free').startsWith('gemini'),")
          ])

          edit('src/lib/model-routing.js', [
            ("['coding', /\\b(code|coding|debug|bug|error|stack trace|react|javascript|typescript|python|html|css|api|database|sql|component|function|repository|refactor|deploy|build (?:an?|the)|app|website)\\b/i],",
             "['coding', /\\b(code|coding|debug|bug|error|stack trace|react|javascript|typescript|python|html|css|api|database|sql|component|function|repository|refactor|deploy|build (?:an?|the)|app|website|web app|calculator|frontend|ui)\\b/i],"),
            ("if (/nemotron|gpt-oss|coder|qwen|deepseek/.test(haystack)) score += 24;",
             "if (/laguna|poolside/.test(haystack)) score += 28;\n    if (/nemotron|gpt-oss|coder|qwen|deepseek/.test(haystack)) score += 24;"),
            ("if (/nemotron|gpt-oss/.test(haystack)) score += 20;",
             "if (/laguna|poolside/.test(haystack)) score += 24;\n    if (/nemotron|gpt-oss/.test(haystack)) score += 20;")
          ])

          edit('src/App.jsx', [
            ("    { id: 'nvidia/nemotron-3-super-120b-a12b:free', name: 'Nemotron 3 Super 120B', specialty: 'Complex Planning, Analysis & Coding', badge: 'Recommended Free', provider: 'NVIDIA', available: true, pricingKind: 'free' },\n    { id: 'openai/gpt-oss-120b:free', name: 'GPT-OSS 120B', specialty: 'Open-weight reasoning and coding fallback', badge: 'Free Fallback', provider: 'OpenAI', available: true, pricingKind: 'free' },",
             "    { id: 'poolside/laguna-s-2.1:free', name: 'Laguna S 2.1', specialty: 'Software Creation, Coding & Agentic Builds', badge: 'Recommended Free', provider: 'Poolside', available: true, pricingKind: 'free' },\n    { id: 'nvidia/nemotron-3-ultra-550b-a55b:free', name: 'Nemotron 3 Ultra', specialty: 'Deep Reasoning & Independent Free Fallback', badge: 'Free Fallback', provider: 'NVIDIA', available: true, pricingKind: 'free' },")
          ])

          edit('api/chat.ts', [
            ("  \"nvidia/nemotron-3-super-120b-a12b:free\",\n  \"openai/gpt-oss-120b:free\",",
             "  // Legacy Super remains accepted so already-open browser tabs can fail over\n  // without surfacing an approval error. It is no longer exposed as default.\n  \"nvidia/nemotron-3-super-120b-a12b:free\",\n  \"poolside/laguna-s-2.1:free\",\n  \"nvidia/nemotron-3-ultra-550b-a55b:free\",")
          ])
          PY
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/p0-live-model-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(models): route around dead free endpoints"
          git push origin HEAD:fix/p0-live-model-route
