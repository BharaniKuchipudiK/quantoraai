name: Strengthen Studio visual proof

on:
  push:
    branches:
      - fix/studio-p0-preview-navigation
    paths:
      - .github/workflows/patch-studio-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-p0-preview-navigation
      - name: Require rendered calculator and screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/studio-regression-browser-gate.mjs')
          s = p.read_text()
          s = s.replace("import process from 'node:process';\n", "import process from 'node:process';\nimport { mkdirSync } from 'node:fs';\n", 1)
          anchor = """async function hidden(locator, message, timeout = 5000) {\n  await locator.waitFor({ state: 'hidden', timeout }).catch(() => {});\n  if (await locator.isVisible().catch(() => false)) throw new Error(message);\n}\n"""
          helper = anchor + """\nasync function visibleInAnyFrame(selector, timeout = 15000) {\n  const deadline = Date.now() + timeout;\n  while (Date.now() < deadline) {\n    for (const frame of page.frames()) {\n      if (await frame.locator(selector).first().isVisible().catch(() => false)) return true;\n    }\n    await page.waitForTimeout(250);\n  }\n  return false;\n}\n"""
          if anchor not in s:
              raise SystemExit('helper anchor missing')
          s = s.replace(anchor, helper, 1)
          old = """  const calculatorPreview = page.locator('[data-quantora-real-project-preview=\"true\"]').first();\n  await visible(calculatorPreview, 'Standalone calculator JSX did not enter the real React project preview.', 15_000);\n  await hidden(page.getByText(/Couldn't auto-fix after/i).first(), 'Calculator preview entered the broken auto-repair state.');\n"""
          new = """  const calculatorPreview = page.locator('[data-quantora-real-project-preview=\"true\"]').first();\n  await visible(calculatorPreview, 'Standalone calculator JSX did not enter the real React project preview.', 15_000);\n  await hidden(page.getByText(/Couldn't auto-fix after/i).first(), 'Calculator preview entered the broken auto-repair state.');\n  if (!(await visibleInAnyFrame('[data-testid=\"calculator-display\"]', 20_000))) {\n    throw new Error('Calculator project runtime mounted, but the generated calculator itself never rendered.');\n  }\n  mkdirSync('artifacts/e2e', { recursive: true });\n  await page.screenshot({ path: 'artifacts/e2e/studio-calculator-preview.png', fullPage: true });\n"""
          if old not in s:
              raise SystemExit('calculator assertion block missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-studio-evidence.yml
          git config user.name "quantora-quality-bot"
          git config user.email "quality@quantoraai.app"
          git add scripts/studio-regression-browser-gate.mjs .github/workflows/patch-studio-evidence.yml
          git commit -m "test(studio): require rendered calculator visual evidence"
          git push origin HEAD:fix/studio-p0-preview-navigation
