name: Apply Landing Replay

on:
  push:
    branches:
      - feat/quantora-landing-current-main

permissions:
  contents: write

jobs:
  replay:
    if: ${{ !contains(github.event.head_commit.message, '[landing-replay-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current-main landing branch
        uses: actions/checkout@v4
        with:
          ref: feat/quantora-landing-current-main
          fetch-depth: 0

      - name: Fetch reviewed landing source
        run: |
          git fetch origin feat/quantora-million-dollar-foundation:refs/remotes/origin/feat/quantora-million-dollar-foundation

      - name: Replay only active landing files
        run: |
          git checkout origin/feat/quantora-million-dollar-foundation -- \
            index.html \
            public/landing/done-document.svg \
            public/landing/done-presentation.svg \
            public/landing/done-website.svg \
            src/components/LandingPage.css \
            src/components/LandingPage.jsx \
            src/styles/pcl-motion.css \
            src/styles/future-capabilities.css \
            src/styles/landing-convergence.css

      - name: Preserve current runtime and calm the hero motion
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('src/main.jsx')
          main = main_path.read_text()
          anchor = "import './styles/studio-toolbar-cleanup.css'\n"
          additions = (
              "import './styles/pcl-motion.css'\n"
              "import './styles/future-capabilities.css'\n"
              "import './styles/landing-convergence.css'\n"
          )
          if main.count(anchor) != 1:
              raise SystemExit(f'Expected one main.jsx style anchor; found {main.count(anchor)}')
          if any(line in main for line in additions.splitlines()):
              raise SystemExit('Landing styles already present in current main.jsx; refusing ambiguous replay.')
          if "FeedbackWidget" not in main or "<FeedbackWidget />" not in main:
              raise SystemExit('Current Feedback runtime mount is missing; refusing to overwrite current main.')
          main = main.replace(anchor, anchor + additions, 1)
          main_path.write_text(main)

          landing_path = Path('src/components/LandingPage.jsx')
          landing = landing_path.read_text()
          old_timer = """    const timer = window.setInterval(() => {\n      setActivePanel((value) => (value + 1) % PLATFORM_PANELS.length);\n    }, 4200);"""
          new_timer = """    const timer = window.setInterval(() => {\n      setActivePanel((value) => (value + 1) % PLATFORM_PANELS.length);\n    }, 7000);"""
          if landing.count(old_timer) != 1:
              raise SystemExit(f'Expected one 4.2s CognitiveStage timer; found {landing.count(old_timer)}')
          landing = landing.replace(old_timer, new_timer, 1)
          landing_path.write_text(landing)

          convergence_path = Path('src/styles/landing-convergence.css')
          convergence = convergence_path.read_text()
          marker = '/* Current-main calm-motion override: the panel highlight carries the story; no independent travelling signal. */'
          if marker in convergence:
              raise SystemExit('Calm-motion override already exists; refusing duplicate append.')
          convergence += f"\n\n{marker}\n.q-cognitive-stage .q-cognitive-signal {{\n  display: none !important;\n}}\n"
          convergence_path.write_text(convergence)

      - name: Commit clean landing replay
        run: |
          git config user.name "Quantora Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html public/landing src/components/LandingPage.css src/components/LandingPage.jsx src/main.jsx src/styles/pcl-motion.css src/styles/future-capabilities.css src/styles/landing-convergence.css
          git diff --cached --check
          git commit -m "Replay converged landing on current production baseline [landing-replay-applied]"
          git push origin HEAD:feat/quantora-landing-current-main
