name: Market Data Ingestion (Finance)

# Fills the Finance market-data tables (ADR-025) from free public sources —
# ECB FX via Frankfurter and the SEC EDGAR equity universe. Isolated: it only
# writes market_* tables in Supabase and touches no application code path.
#
# The daily schedule is ON. It was left commented out pending the repository
# secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY, and those have been set
# since at least 2026-08-24 - the run on 2026-08-26 wrote 7,650 FX rows and
# 10,388 instruments, so the precondition was met days before anyone noticed.
# Until now this had run five times, every one of them by hand, which meant the
# stored rate aged past the four-day staleness window and the Finance desk
# refused every conversion in between.

on:
  workflow_dispatch:
  schedule:
    # 17:30 UTC on weekdays — after the ECB publishes reference rates (~16:00
    # CET). The old 05:30 would have refreshed to the PREVIOUS day's rate every
    # morning, which is a day behind for anyone asking before the afternoon.
    - cron: "30 17 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Pull free market data into Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ingest market data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/ingest-market-data.ts
