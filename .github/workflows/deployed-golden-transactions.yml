name: Deployed Golden Transactions

# Owner-requested emergency cost containment, 2026-09-10.
# Automatic events retain deployed readiness, durable-store and fixture checks.
# Real generation (including the Gemini probe, critics, repairs and fallbacks)
# runs ONLY on a deliberate dispatch with spending confirmed for that run.
# Skipped live tests are NOT release evidence. Do not release application changes
# claiming live verification while this containment policy is in effect.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  deployment_status:
  workflow_dispatch:
    inputs:
      confirm_live_model_spend:
        description: 'I authorize this one run to spend provider credit on two live build tests and their probe/verification/repair calls.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: read

env:
  PLAYWRIGHT_VERSION: 1.55.1

concurrency:
  group: deployed-golden-${{ github.event.pull_request.number || github.event.deployment.environment }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  golden-transactions:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_model_spend == true && 'Deployed golden transactions' || 'Deployed non-model checks (live tests NOT RUN)' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      startsWith(github.event.deployment_status.environment_url, 'https://') &&
      github.event.deployment.ref != '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.deployment.sha || github.sha }}

      - name: Resolve the exact deployed target
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_URL: ${{ github.event.deployment_status.environment_url }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "deployment_status" ]; then
            echo "url=$EVENT_URL" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 60); do
            deployment_id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$PR_SHA&environment=$TARGET_ENVIRONMENT&per_page=10" --jq '.[0].id // empty')
            if [ -n "$deployment_id" ]; then
              deployed_url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=10" --jq 'map(select(.state == "success" and (.environment_url // "") != ""))[0].environment_url // empty')
              if [[ "$deployed_url" == https://* ]]; then
                echo "url=$deployed_url" >> "$GITHUB_OUTPUT"
                echo "sha=$PR_SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No successful $TARGET_ENVIRONMENT deployment was published for $PR_SHA within 10 minutes." >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - name: Install browser binary
        run: npx playwright install chromium

      - name: Deployed readiness (inference ready, every function boots)
        env:
          QUANTORA_E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deployed-readiness-gate.mjs
      - name: Deployed QIR durability (a Run outlives the worker that made it)
        env:
          QUANTORA_E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deployed-qir-durability-gate.mjs

      - name: Prove prompt to rendered calculator and website
        id: golden_chat
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_model_spend == true }}
        env:
          QUANTORA_E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          QUANTORA_DEPLOYMENT_SHA: ${{ steps.deployment.outputs.sha }}
          # Retain the existing roster contract. A manual dispatch has no PR
          # title and therefore selects two; a title cannot authorize spending.
          QUANTORA_GOLDEN_TRANSACTION_LIMIT: ${{ contains(github.event.pull_request.title, '[golden:all]') && '99' || '2' }}
        run: node scripts/deployed-golden-transactions.mjs

      # Fixtures, not generation. Preserve this independent failure signal.
      - name: Prove deployed shop Preview paints photos and cart increments
        id: shop_act
        if: always()
        env:
          QUANTORA_E2E_BASE_URL: ${{ steps.deployment.outputs.url }}
          QUANTORA_GOLDEN_CANARY_TOKEN: ${{ secrets.QUANTORA_GOLDEN_CANARY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          QUANTORA_DEPLOYMENT_SHA: ${{ steps.deployment.outputs.sha }}
        run: node scripts/deployed-shop-preview-gate.mjs
      - name: Upload deployed transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-golden-${{ steps.deployment.outputs.sha }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 14
      - name: Report deployed golden chat outcome
        if: always()
        env:
          GOLDEN_CHAT_OUTCOME: ${{ steps.golden_chat.outcome }}
        run: |
          echo "deployed calculator/website golden outcome=$GOLDEN_CHAT_OUTCOME"
          if [ "$GOLDEN_CHAT_OUTCOME" = "skipped" ]; then
            echo "::notice::LIVE MODEL VERIFICATION NOT RUN: automatic provider spending is paused by the owner. Non-model checks are not proof of live generation."
            echo "### Live model verification: NOT RUN (owner-requested spending pause)" >> "$GITHUB_STEP_SUMMARY"
            echo "Readiness, persistence and fixture checks are separate evidence. Do not use their success to claim live model verification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f artifacts/e2e/golden-verdict.txt ]; then
            cat artifacts/e2e/golden-verdict.txt
          fi
          if [ "$GOLDEN_CHAT_OUTCOME" != "success" ]; then
            echo "::error::The requested live model verification did not pass. Do not merge or promote application changes."
            exit 1
          fi
