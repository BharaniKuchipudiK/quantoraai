name: Vercel Flags lockfile generator

on:
  pull_request:
    paths:
      - .github/workflows/vercel-flags-lockfile-gen.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate locked Vercel Flags dependency
        run: npm install @vercel/flags-core@1.8.0 --package-lock-only --ignore-scripts
      - name: Apply exact manifests to feature branch
        shell: bash
        run: |
          cp package.json /tmp/quantora-package.json
          cp package-lock.json /tmp/quantora-package-lock.json
          git fetch origin platform/vercel-flags-foundation
          git checkout -B platform/vercel-flags-foundation origin/platform/vercel-flags-foundation
          cp /tmp/quantora-package.json package.json
          cp /tmp/quantora-package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Generated manifests already match feature branch."
            exit 0
          fi
          git commit -m "Add Vercel Flags core dependency"
          git push origin HEAD:platform/vercel-flags-foundation
