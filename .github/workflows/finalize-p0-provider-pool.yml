name: Finalize P0 provider pool
on:
  push:
    branches: [fix/p0-studio-provider-failover-workspace]
    paths: ['.github/workflows/finalize-p0-provider-pool.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-studio-provider-failover-workspace
      - name: Patch final provider pool and runtime failover
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('src/App.jsx',
          "  const fallbackModels = [\n    { id: 'nvidia/nemotron-3-super-120b-a12b:free', name: 'Nemotron 3 Super 120B', specialty: 'Complex Planning, Analysis & Coding', badge: 'Recommended Free', provider: 'NVIDIA', available: true, pricingKind: 'free' },\n    { id: 'openai/gpt-oss-120b:free', name: 'GPT-OSS 120B', specialty: 'Open-weight reasoning and coding fallback', badge: 'Free Fallback', provider: 'OpenAI', available: true, pricingKind: 'free' },\n    { id: 'gemini-flash-latest', name: 'Gemini Flash', specialty: 'Optional multimodal route', badge: 'Multimodal', provider: 'Google', available: true, pricingKind: 'free-tier' },",
          "  const fallbackModels = [\n    { id: 'nvidia/nemotron-3-ultra-550b-a55b:free', name: 'Nemotron 3 Ultra', specialty: 'Reasoning, coding and agentic build orchestration', badge: 'Recommended Free', provider: 'NVIDIA', available: true, pricingKind: 'free' },\n    { id: 'nvidia/nemotron-3-super-120b-a12b:free', name: 'Nemotron 3 Super 120B', specialty: 'Fast coding, planning and general reasoning fallback', badge: 'Free Fallback', provider: 'NVIDIA', available: true, pricingKind: 'free' },\n    { id: 'gemini-flash-latest', name: 'Gemini Flash', specialty: 'Optional multimodal route', badge: 'Multimodal', provider: 'Google', available: true, pricingKind: 'free-tier' },")

          replace('api/chat.ts',
          'const FEATURED_SERVER_MODELS = new Set([\n  "gemini-flash-latest",\n  "nvidia/nemotron-3-super-120b-a12b:free",\n  "openai/gpt-oss-120b:free",',
          'const FEATURED_SERVER_MODELS = new Set([\n  "gemini-flash-latest",\n  "nvidia/nemotron-3-ultra-550b-a55b:free",\n  "nvidia/nemotron-3-super-120b-a12b:free",')

          p = Path('api/chat.ts')
          text = p.read_text()
          start = text.find("    const openRouterAttempts = attempts.filter((attempt) => attempt.provider === 'openrouter');")
          end = text.find("    const latencyMs = Date.now() - startTime;", start)
          if start == -1 or end == -1:
              raise SystemExit('OpenRouter execution block markers not found')
          replacement = '''    const openRouterAttempts = attempts.filter((attempt) => attempt.provider === 'openrouter');
    let usedOpenRouterModel = '';
    let modelFallbackUsed = false;
    let lastError: any = null;
    let fullReply = '';

    for (let index = 0; index < openRouterAttempts.length; index += 1) {
      assertBudget(startTime, TOTAL_CHAT_BUDGET_MS, 'chat turn');
      const attempt = openRouterAttempts[index];
      const resolved = resolveOpenRouterModelId(attempt.id);
      if (resolved.error) {
        lastError = new Error(resolved.error);
        continue;
      }

      try {
        const response = await openOpenRouterResponse({
          key: effectiveOpenRouterKey,
          modelId: resolved.slug as string,
          modelName: attempt.id,
          messages: formattedHistory,
          temperature: dynamicTemperature,
          grounding,
          jsonMode: finalSystemPrompt.includes("JSON DECK SPEC"),
        });
        if (!response.body) throw new Error("OpenRouter API returned no body.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let attemptReply = '';
        let buffer = '';
        let upstreamStreamError: any = null;

        while (true) {
          assertBudget(startTime, TOTAL_CHAT_BUDGET_MS, 'chat turn');
          const { done, value } = await readWithIdleTimeout(reader, PROVIDER_STREAM_IDLE_MS, 'OpenRouter stream');
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (!line.startsWith('data: ') || line === 'data: [DONE]') continue;
            try {
              const parsed = JSON.parse(line.slice(6));
              if (parsed?.error) {
                const upstreamError: any = new Error(parsed?.error?.message || 'OpenRouter stream failed.');
                upstreamError.status = Number(parsed?.error?.code || parsed?.error?.status || 503);
                upstreamStreamError = upstreamError;
                continue;
              }
              const token = parsed.choices?.[0]?.delta?.content || '';
              if (token) {
                attemptReply += token;
                fullReply += token;
                sse.text(token);
              }
            } catch { /* ignore malformed upstream event */ }
          }
        }

        if (attemptReply.trim()) {
          usedOpenRouterModel = resolved.slug as string;
          modelFallbackUsed = index > 0;
          break;
        }

        const emptyError: any = upstreamStreamError || new Error(`OpenRouter model "${attempt.id}" returned an empty response.`);
        emptyError.status = Number(emptyError.status || 503);
        lastError = emptyError;
        if (sse.isStarted || index >= openRouterAttempts.length - 1) throw emptyError;
      } catch (error) {
        lastError = error;
        if (sse.isStarted || index >= openRouterAttempts.length - 1 || !shouldFallbackBeforeStreaming(error)) throw error;
      }
    }

    if (!usedOpenRouterModel || !fullReply.trim()) {
      throw lastError || Object.assign(new Error('No healthy OpenRouter model returned content.'), { status: 503 });
    }

'''
          p.write_text(text[:start] + replacement + text[end:])

          # Strengthen Studio gate: a build request must expose its workspace before the provider reply arrives.
          p = Path('scripts/studio-regression-browser-gate.mjs')
          text = p.read_text()
          old = """  if (path === '/api/chat') {\n    const body = request.postDataJSON?.() || {};\n    const reply = /calculator/i.test(String(body.message || '')) ? calculatorReply : projectReply;\n    return route.fulfill({ status: 200, headers: { 'content-type': 'text/event-stream; charset=utf-8', 'cache-control': 'no-cache' }, body: sseBody(reply) });\n  }"""
          new = """  if (path === '/api/chat') {\n    const body = request.postDataJSON?.() || {};\n    const reply = /calculator/i.test(String(body.message || '')) ? calculatorReply : projectReply;\n    if (/calculator/i.test(String(body.message || ''))) await new Promise((resolve) => setTimeout(resolve, 1200));\n    return route.fulfill({ status: 200, headers: { 'content-type': 'text/event-stream; charset=utf-8', 'cache-control': 'no-cache' }, body: sseBody(reply) });\n  }"""
          if old not in text:
              raise SystemExit('Studio /api/chat route block not found')
          text = text.replace(old, new, 1)
          old2 = """  await prompt.fill('Build me a simple calculator');\n  await prompt.press('Enter');\n\n  const calculatorPreview"""
          new2 = """  await prompt.fill('Build me a simple calculator');\n  await prompt.press('Enter');\n  await visible(page.locator('[data-quantora-code-workspace=\"true\"]').first(), 'Build request did not open the Studio workspace before provider response.', 800);\n  await visible(page.locator('[data-quantora-preview-waiting=\"true\"]').first(), 'Build request did not expose a persistent preview surface while waiting for provider response.', 800);\n\n  const calculatorPreview"""
          if old2 not in text:
              raise SystemExit('Studio calculator send marker not found')
          p.write_text(text.replace(old2, new2, 1))
          PY
      - name: Commit and self-remove
        run: |
          git config user.name "quantora-quality-bot"
          git config user.email "quality@quantoraai.app"
          git add src/App.jsx api/chat.ts scripts/studio-regression-browser-gate.mjs
          git commit -m "fix(p0): use qualified free pool and retry empty streams"
          git rm .github/workflows/finalize-p0-provider-pool.yml
          git commit -m "chore: remove temporary provider-pool workflow"
          git push origin HEAD:fix/p0-studio-provider-failover-workspace
