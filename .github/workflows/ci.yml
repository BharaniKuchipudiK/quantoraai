name: Quantora CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quantora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Lint (no-undef, frontend)
        run: npm run lint:undef

      - name: Run all tests
        run: npm run test:all

      - name: Build production artifacts
        run: npm run build

      - name: Audit high-severity dependencies
        # Fails on any high/critical advisory EXCEPT a documented allowlist of
        # unfixable, unreachable transitives. Currently: image-size (and its
        # dependent pptxgenjs) — a DoS in ICNS/JXL/HEIF image PARSERS. We only
        # generate text-based .pptx server-side and never parse untrusted images,
        # so it is not reachable; every published image-size version is flagged,
        # so there is no version to upgrade to. See docs/CI-ENFORCEMENT.md.
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json');const allow=new Set(['image-size','pptxgenjs']);const bad=Object.entries(a.vulnerabilities||{}).filter(([k,v])=>['high','critical'].includes(v.severity)&&!allow.has(k));if(bad.length){console.error('Disallowed high/critical advisories:',bad.map(([k])=>k).join(', '));process.exit(1);}console.log('Audit OK (allowlisted unreachable transitives:',[...allow].join(', '),')');"
