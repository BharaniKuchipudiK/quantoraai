name: Quantora CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/code-preview-canvas-cleanup

permissions:
  contents: read
  statuses: write

concurrency:
  group: quantora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Lint (no-undef, frontend)
        run: npm run lint:undef

      - name: Run all tests
        run: npm run test:all

      - name: Build production artifacts
        run: npm run build

      - name: Audit high-severity dependencies
        # Fails on any high/critical advisory EXCEPT a documented allowlist of
        # unfixable, unreachable transitives. Currently: image-size (and its
        # dependent pptxgenjs) — a DoS in ICNS/JXL/HEIF image PARSERS. We only
        # generate text-based .pptx server-side and never parse untrusted images,
        # so it is not reachable; every published image-size version is flagged,
        # so there is no version to upgrade to. See docs/CI-ENFORCEMENT.md.
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json');const allow=new Set(['image-size','pptxgenjs']);const bad=Object.entries(a.vulnerabilities||{}).filter(([k,v])=>['high','critical'].includes(v.severity)&&!allow.has(k));if(bad.length){console.error('Disallowed high/critical advisories:',bad.map(([k])=>k).join(', '));process.exit(1);}console.log('Audit OK (allowlisted unreachable transitives:',[...allow].join(', '),')');"

      - name: Publish verification status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          curl --fail --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Quantora Verify\",\"description\":\"Typecheck, tests, build and audit: ${JOB_STATUS}\",\"target_url\":\"${RUN_URL}\"}"

  travel-browser-gate:
    name: Browser release gates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-like Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/quantora-preview.log 2>&1 &
          echo $! > /tmp/quantora-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quantora-preview.log
          exit 1

      - name: Execute Travel browser journey
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
          QUANTORA_E2E_TURN_SLA_MS: 8000
        run: node scripts/travel-browser-release-gate.mjs

      - name: Execute media and profile browser journey
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/media-profile-browser-gate.mjs

      - name: Execute Studio precision browser journey
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/studio-regression-browser-gate.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-gates
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish browser status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          curl --fail --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Quantora Browser\",\"description\":\"User journeys and visual evidence: ${JOB_STATUS}\",\"target_url\":\"${RUN_URL}\"}"
