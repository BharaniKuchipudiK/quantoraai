name: Quantora CI

on:
  pull_request:
  push:
    branches:
      - main
  # Run it on demand against any ref.
  #
  # Added on 2026-09-04, when three consecutive pushes to a PR branch produced
  # NO workflow run at all: Vercel's deployment_status events kept creating
  # runs while every pull_request synchronize stopped, so the code was pushed
  # and nothing measured it. Local green is necessary and never sufficient
  # here, and a suite that cannot be started is the same as no suite.
  workflow_dispatch:

permissions:
  contents: read

# Cache key only. The version itself now lives in package.json, pinned exactly,
# so this must be bumped in step with it or the gates restore a cache built for
# a different browser build.
env:
  PLAYWRIGHT_VERSION: 1.55.1

concurrency:
  group: quantora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Lint (no-undef, frontend)
        run: npm run lint:undef

      # Runs before everything: it is instant, and it catches the one class of
      # defect that typecheck, build AND the whole suite are all blind to —
      # a relative import with no runtime extension, which resolves fine in
      # tsc/tsx and dies with ERR_MODULE_NOT_FOUND in production.
      - name: Runtime import gate (imports that only fail in production)
        run: npm run test:imports

      # Also instant, and also blind spots everywhere else: a useCallback/useMemo
      # dependency array naming a binding declared further down the component
      # throws on first render. tsc exits 0, vite build exits 0, and 1645 unit
      # tests pass because none of them render the component — the only thing
      # that caught it was the browser suite timing out on a textarea, at the
      # end of a full CI cycle, with 2 gates failed and 24 skipped and nothing
      # naming the cause.
      - name: Hook dependency order gate (a dep array that throws on first render)
        run: npm run test:hook-order

      # Runs before the suite because it takes a second and catches the one
      # thing 1400 passing tests cannot: a feature that is tested and reachable
      # by nothing. Also inside test:all, so it holds locally too.
      - name: Wiring gate (tested but called by nothing)
        run: npm run test:wiring

      # BLOCKING. 160 hostile replies through the real desk path, no model calls,
      # asserting invariants ("a failed turn must not destroy the user's build"),
      # never golden output — so it is deterministic and precise enough to block.
      # It was report-only while it carried one real defect, judged and fixed on
      # 2026-09-05: an unfenced page deleted its siblings (`file-lost`, 8 of 8
      # arrival shapes). A muted red check is the 2026-08-31 incident's shape
      # exactly (CLAUDE.md §1); this step was red the whole time it was muted.
      - name: Pipeline stress (hostile replies, no model calls)
        run: npm run test:stress

      - name: Run all tests
        run: npm run test:all

      - name: Finance judgment gate
        run: npm run test:judgment

      - name: Capability claims gate
        run: node scripts/capability-claims-gate.mjs

      - name: Platform dead control gate
        run: node scripts/platform-dead-control-gate.mjs

      # Every user journey names the gates that exercise it, every gate on disk
      # names its journey, and the proven count is a floor that only rises.
      # The last line of this step is the number: JOURNEY COVERAGE | ...
      - name: Journey-versus-gate inventory is true, and stable is a number
        run: npm run test:journeys

      - name: Shop catalog photos scale gate
        run: node scripts/shop-catalog-photos-scale-gate.mjs

      - name: Build production artifacts
        run: npm run build

      - name: Audit high-severity dependencies
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json');const allow=new Set(['image-size','pptxgenjs']);const bad=Object.entries(a.vulnerabilities||{}).filter(([k,v])=>['high','critical'].includes(v.severity)&&!allow.has(k));if(bad.length){console.error('Disallowed high/critical advisories:',bad.map(([k])=>k).join(', '));process.exit(1);}console.log('Audit OK (allowlisted unreachable transitives:',[...allow].join(', '),')');"

  browser-gates:
    name: Browser release gates
    # No 'needs: verify'. These run on their own runners and share nothing with
    # it, so gating them on it only serialised the wall clock: verify takes
    # ~8-10 minutes and the browser jobs then took another ~4-6, making a green
    # cycle ~14 minutes when the work itself is ~9.
    #
    # The tradeoff is deliberate. Waiting saved RUNNER MINUTES on a red build by
    # not starting browsers for code that does not compile. Running in parallel
    # saves WALL CLOCK on a green build. Green is the common case, and on
    # 2026-09-04 four CI cycles in eighty minutes was the actual cost of this
    # branch keeping up with main. Time to feedback is what was scarce, not
    # runner minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      # Only the browser binary is fetched here now. Playwright itself is a
      # pinned devDependency, so `npm ci` above already installed it from the
      # lockfile using the cache setup-node restores.
      #
      # It used to be installed here with --no-save --package-lock=false, which
      # forced a full registry resolution on every run: measured at ~51s, and
      # the reason a cache hit still saved nothing GitHub would bill. That flag
      # combination also kept Playwright out of package.json, and so out of the
      # audit gate — which is how CI ran 1.55.0 for months against a high
      # severity advisory (GHSA-7mvr-c777-76hp, browsers downloaded without
      # verifying certificate authenticity) that the gate could not see.
      #
      # No --with-deps: the ubuntu-24.04 image already carries Chromium's system
      # libraries, confirmed by a full gate run without them. If that ever stops
      # being true it fails loudly — Chromium will not launch, so the first gate
      # fails on every run rather than one gate sometimes — and the fix is to
      # restore --with-deps on this step.
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}

      - name: Install browser binary
        run: npx playwright install chromium

      - name: Start production-like Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/quantora-preview.log 2>&1 &
          echo $! > /tmp/quantora-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quantora-preview.log
          exit 1

      - name: Execute cross-workspace visual contract
        id: workspace_contract
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/workspace-contract-browser-gate.mjs

      # BLOCKING. It went in red with a stated end condition — "this loses
      # continue-on-error when the auto-open bug is fixed" — and the bug is
      # fixed, so it has.
      #
      # What it caught: the second build in any session rendered no preview.
      # The commit block ended `if (assembled.reopenDesk) setCodingDeskOpen(true)`
      # and reopenDesk is `hadProject && didUpdate`, so a chat's FIRST build
      # never opened the desk. New Chat resets codingDeskOpen to false, and the
      # preview pane is gated on it, so ProjectRuntimePreview was never mounted:
      #
      #   bakeryVfs=true wsMode=true runCode=true deskOpen=FALSE
      #
      # Everything right except the one flag deciding whether any of it is on
      # screen. The deployed golden hit this as its website transaction, and no
      # local gate covered a second build because the first had never passed.
      - name: Prove a second build in one session still previews
        id: second_transaction
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/second-transaction-browser-gate.mjs

      - name: Execute platform experience budget
        id: platform_experience
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
          QUANTORA_PLATFORM_SHELL_SLA_MS: 4000
          QUANTORA_PLATFORM_SWITCH_SLA_MS: 1200
          QUANTORA_PLATFORM_INPUT_SLA_MS: 350
          QUANTORA_PLATFORM_MAX_LONG_TASK_MS: 500
          QUANTORA_PLATFORM_TOTAL_LONG_TASK_MS: 1600
        run: node scripts/platform-experience-browser-gate.mjs

      - name: Execute Travel browser journey
        id: travel_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
          QUANTORA_E2E_TURN_SLA_MS: 8000
        run: node scripts/travel-browser-release-gate.mjs

      - name: Execute Study media browser journey
        id: study_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/study-media-browser-gate.mjs

      - name: Execute Study Electricity proving vertical
        id: study_electricity_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/study-electricity-browser-gate.mjs

      - name: Execute Study representation release journey
        id: study_representation_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/study-representation-browser-gate.mjs

      - name: Execute Study Notebook browser journey
        id: study_notebook_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/study-notebook-browser-gate.mjs

      - name: Execute Study onboarding and reinforcement journey
        id: study_h14_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/study-onboarding-reinforcement-browser-gate.mjs

      - name: Execute Finance browser journey
        id: finance_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/finance-browser-gate.mjs

      - name: Execute media and profile browser journey
        id: media_profile_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/media-profile-browser-gate.mjs

      - name: Execute Studio regression journey
        id: studio_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/studio-regression-browser-gate.mjs

      - name: Execute Coding desk sticky journey
        id: coding_desk_sticky_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/coding-desk-sticky-browser-gate.mjs

      - name: Execute session handover journey
        id: session_handover_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/session-handover-browser-gate.mjs

      - name: Execute turn planner journey
        id: turn_planner_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/turn-planner-browser-gate.mjs

      - name: Execute desk edit honesty journey
        id: desk_edit_honesty_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-edit-honesty-browser-gate.mjs

      - name: Execute code payload journey
        id: code_payload_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/code-highlight-browser-gate.mjs

      - name: Execute failed-turn self-heal journey
        id: self_heal_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/self-heal-browser-gate.mjs

      - name: Execute desk diff review journey
        id: desk_diff_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-diff-review-browser-gate.mjs

      - name: Execute desk job review journey
        id: desk_job_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-job-review-browser-gate.mjs

      - name: Execute desk review patch journey
        id: desk_review_patch_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-review-patch-browser-gate.mjs

      - name: Execute desk chat claim journey
        id: desk_chat_claim_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-chat-claim-browser-gate.mjs

      - name: Execute Coding Desk must-write-files journey
        id: coding_desk_files_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/coding-desk-must-write-files-browser-gate.mjs

      # The 2026-09-01 boutique class: a first-turn website ask must get its
      # designer question (modal, no false failure, no burned retry), and the
      # answer must land a build. Neither deployed golden covers guided intake.
      - name: Execute guided intake journey
        id: guided_intake_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/guided-intake-browser-gate.mjs

      - name: Execute Coding Desk chrome journey
        id: coding_desk_chrome_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/coding-desk-chrome-browser-gate.mjs

      # Runs early among the desk gates and takes a few seconds: it answers
      # "is the desk alive at all" before the longer journeys spend minutes
      # discovering the same thing three steps in.
      - name: Execute desk rail smoke
        id: desk_rail_smoke_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-rail-smoke-browser-gate.mjs

      - name: Execute Preview ready not stuck (Start with 10 shop act)
        id: preview_ready_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/preview-ready-not-stuck-gate.mjs

      - name: Execute Preview shell must start (turn-busy fail clock)
        id: preview_shell_must_start_gate
        continue-on-error: true
        run: node scripts/preview-shell-must-start-gate.mjs

      - name: Execute QIR Coding durable resume journey
        id: qir_coding_resume_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/qir-coding-resume-browser-gate.mjs

      - name: Execute QIR production recovery was-red journeys
        id: qir_production_recovery_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/qir-production-recovery-browser-gate.mjs

      # 2026-09-05: four documents attached to one chat turn were dropped in the
      # browser as "(not a readable image)". The composer, the send path and the
      # desk's account of what was read, with no model.
      - name: Execute attachments journey
        id: attachments_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/attachments-browser-gate.mjs

      # 2026-09-05: "This turn ended without a reply … Reference: studio-…" was a
      # handle to nothing. The reference the desk shows must be the id the
      # request carried, the desk's own record goes under it, and "What
      # happened?" renders the server's account. No model.
      - name: Execute trace lookup journey
        id: trace_lookup_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/trace-lookup-browser-gate.mjs

      - name: Prove the front door (sign in with email and password, come back signed in, sign out)
        id: front_door_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/front-door-browser-gate.mjs

      - name: Prove shipping from the desk (share link, publish to Vercel, push to GitHub)
        id: desk_publish_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/desk-publish-browser-gate.mjs

      - name: Prove a developer's own repository imports and its changes go out as changes
        id: repo_work_gate
        continue-on-error: true
        env:
          QUANTORA_E2E_BASE_URL: http://127.0.0.1:4173
        run: node scripts/repo-work-browser-gate.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-gates
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce browser release gates
        if: always()
        env:
          WORKSPACE_OUTCOME: ${{ steps.workspace_contract.outcome }}
          PLATFORM_OUTCOME: ${{ steps.platform_experience.outcome }}
          TRAVEL_OUTCOME: ${{ steps.travel_gate.outcome }}
          STUDY_OUTCOME: ${{ steps.study_gate.outcome }}
          STUDY_ELECTRICITY_OUTCOME: ${{ steps.study_electricity_gate.outcome }}
          STUDY_REPRESENTATION_OUTCOME: ${{ steps.study_representation_gate.outcome }}
          STUDY_NOTEBOOK_OUTCOME: ${{ steps.study_notebook_gate.outcome }}
          STUDY_H14_OUTCOME: ${{ steps.study_h14_gate.outcome }}
          FINANCE_OUTCOME: ${{ steps.finance_gate.outcome }}
          MEDIA_PROFILE_OUTCOME: ${{ steps.media_profile_gate.outcome }}
          STUDIO_OUTCOME: ${{ steps.studio_gate.outcome }}
          CODING_DESK_STICKY_OUTCOME: ${{ steps.coding_desk_sticky_gate.outcome }}
          SESSION_HANDOVER_OUTCOME: ${{ steps.session_handover_gate.outcome }}
          TURN_PLANNER_OUTCOME: ${{ steps.turn_planner_gate.outcome }}
          DESK_EDIT_HONESTY_OUTCOME: ${{ steps.desk_edit_honesty_gate.outcome }}
          CODE_PAYLOAD_OUTCOME: ${{ steps.code_payload_gate.outcome }}
          SELF_HEAL_OUTCOME: ${{ steps.self_heal_gate.outcome }}
          DESK_DIFF_OUTCOME: ${{ steps.desk_diff_gate.outcome }}
          DESK_JOB_OUTCOME: ${{ steps.desk_job_gate.outcome }}
          DESK_REVIEW_PATCH_OUTCOME: ${{ steps.desk_review_patch_gate.outcome }}
          DESK_CHAT_CLAIM_OUTCOME: ${{ steps.desk_chat_claim_gate.outcome }}
          CODING_DESK_FILES_OUTCOME: ${{ steps.coding_desk_files_gate.outcome }}
          GUIDED_INTAKE_OUTCOME: ${{ steps.guided_intake_gate.outcome }}
          CODING_DESK_CHROME_OUTCOME: ${{ steps.coding_desk_chrome_gate.outcome }}
          DESK_RAIL_SMOKE_OUTCOME: ${{ steps.desk_rail_smoke_gate.outcome }}
          PREVIEW_READY_OUTCOME: ${{ steps.preview_ready_gate.outcome }}
          PREVIEW_SHELL_MUST_START_OUTCOME: ${{ steps.preview_shell_must_start_gate.outcome }}
          QIR_CODING_RESUME_OUTCOME: ${{ steps.qir_coding_resume_gate.outcome }}
          QIR_PRODUCTION_RECOVERY_OUTCOME: ${{ steps.qir_production_recovery_gate.outcome }}
          ATTACHMENTS_OUTCOME: ${{ steps.attachments_gate.outcome }}
          TRACE_LOOKUP_OUTCOME: ${{ steps.trace_lookup_gate.outcome }}
          FRONT_DOOR_OUTCOME: ${{ steps.front_door_gate.outcome }}
          DESK_PUBLISH_OUTCOME: ${{ steps.desk_publish_gate.outcome }}
          REPO_WORK_OUTCOME: ${{ steps.repo_work_gate.outcome }}
        run: |
          failed=0
          for gate in WORKSPACE_OUTCOME PLATFORM_OUTCOME TRAVEL_OUTCOME STUDY_OUTCOME STUDY_ELECTRICITY_OUTCOME STUDY_REPRESENTATION_OUTCOME STUDY_NOTEBOOK_OUTCOME STUDY_H14_OUTCOME FINANCE_OUTCOME MEDIA_PROFILE_OUTCOME STUDIO_OUTCOME CODING_DESK_STICKY_OUTCOME SESSION_HANDOVER_OUTCOME TURN_PLANNER_OUTCOME DESK_EDIT_HONESTY_OUTCOME CODE_PAYLOAD_OUTCOME SELF_HEAL_OUTCOME DESK_DIFF_OUTCOME DESK_JOB_OUTCOME DESK_REVIEW_PATCH_OUTCOME DESK_CHAT_CLAIM_OUTCOME CODING_DESK_FILES_OUTCOME GUIDED_INTAKE_OUTCOME CODING_DESK_CHROME_OUTCOME DESK_RAIL_SMOKE_OUTCOME PREVIEW_READY_OUTCOME PREVIEW_SHELL_MUST_START_OUTCOME QIR_CODING_RESUME_OUTCOME QIR_PRODUCTION_RECOVERY_OUTCOME ATTACHMENTS_OUTCOME TRACE_LOOKUP_OUTCOME FRONT_DOOR_OUTCOME DESK_PUBLISH_OUTCOME REPO_WORK_OUTCOME; do
            outcome="${!gate}"
            echo "$gate=$outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::$gate finished with outcome: $outcome"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more browser release gates failed. Release remains blocked."
            exit 1
          fi
          echo "All browser release gates passed."

  desktop-smoke:
    name: Desktop smoke gate
    # Parallel with verify, for the reason given on browser-gates above.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Root dependencies are needed: the desktop renderer resolves React,
      # Vite and Monaco from the repository's node_modules.
      - name: Install locked application dependencies
        run: npm ci

      # The Electron binary is ~100 MB; cache it by the exact pinned version so
      # the download happens once per version, not once per run.
      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Install locked desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Typecheck and bundle the desktop shell
        run: npm run typecheck && npm run build
        working-directory: desktop

      # Drives the real desktop app: sign-in screen, PKCE deep-link sign-in
      # against a local API mirror, launcher, open folder, explorer, Monaco
      # edit saved to disk, shell and git in the folder, chat reporting the
      # mirror's error honestly, sign-out from the native menu. No network.
      - name: Execute desktop smoke gate
        run: xvfb-run -a node scripts/desktop-smoke-gate.mjs
