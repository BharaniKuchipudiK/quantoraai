name: Test CI Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Identify failing test:ci suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Node tests
        run: npm run test:node
      - name: Served routes
        run: npm run test:served-routes
      - name: Critical journeys
        run: npm run test:critical-journeys
      - name: Client contracts
        run: npm run test:client-contracts
      - name: Browser contracts
        run: npm run test:browser-contracts
      - name: QIR proof
        run: npm run test:qir-proof
      - name: Representation contracts
        run: npm run test:representation-contracts
