name: Test CI Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v7
      - id: tests
        shell: bash
        run: |
          files=$(find src api -type f -name '*.test.js' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  node-test:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: Node · ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run test file
        run: node --test "${{ matrix.file }}"
