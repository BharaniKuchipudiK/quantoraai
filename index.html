<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text x='32' y='48' text-anchor='middle' font-family='Georgia,serif' font-size='52' font-weight='700' fill='%23e8bc3a'>Q</text></svg>" />
    <!--
      viewport-fit=cover lets the page paint under the notch and home indicator.
      It is only safe together with the safe-area padding in src/index.css — on
      its own it puts the header under the notch on every iPhone since the X.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quantora | Idea to Outcome</title>

    <!--
      Home-screen install. Deliberately NO service worker: iOS installs from the
      manifest plus the apple-* tags alone, while a service worker persists in
      the browser after it is removed from the site and is the one piece here
      that is genuinely hard to undo. Offline caching is a separate decision.

      iOS reads almost none of the manifest for Add to Home Screen — it wants
      apple-touch-icon and the apple-mobile-web-app-* tags — so both sets exist
      on purpose, not by duplication.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131314" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent draws the app under the status bar; the safe-area
         padding is what keeps the header out from under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quantora" />
    <meta name="description" content="Free outcomes studio. Models answer — Quantora builds, researches, tutors, plans, and proves it before calling it done." />
    <link rel="canonical" href="https://quantoraai.app/" />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quantora" />
    <meta property="og:url" content="https://quantoraai.app/" />
    <meta property="og:title" content="Quantora | Idea to Outcome" />
    <meta property="og:description" content="Free outcomes studio — apps, research, study, travel, finance. Proof before done. Publish when it's real." />
    <meta property="og:image" content="https://quantoraai.app/quantora-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quantora | Idea to Outcome" />
    <meta name="twitter:description" content="Free outcomes studio — apps, research, study, travel, finance. Proof before done. Publish when it's real." />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"Quantora","applicationCategory":"DeveloperApplication","operatingSystem":"Web","url":"https://quantoraai.app/","description":"Free outcomes studio. Models answer — Quantora builds, researches, tutors, plans, and proves it before calling it done.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;700&family=Nunito:wght@500;700;800&family=Syncopate:wght@400;700;800&family=Orbitron:wght@600;700;800;900&family=Michroma&family=Space+Grotesk:wght@500;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
